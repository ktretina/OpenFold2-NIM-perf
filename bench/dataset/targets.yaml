# Gold-standard benchmark dataset for OpenFold2-NIM comparison
# Selection criteria: diverse folds, high-quality structures, single-domain, monomeric

targets:
  # Small α-helical proteins
  - pdb_id: 1VII
    chain: A
    description: "Villin headpiece subdomain (all-α)"
    length: 36
    resolution: 1.80
    fold_type: "alpha"

  - pdb_id: 2KHE
    chain: A
    description: "HP36 villin (all-α, designed)"
    length: 36
    resolution: NMR
    fold_type: "alpha"

  - pdb_id: 1MBN
    chain: A
    description: "Myoglobin (all-α)"
    length: 153
    resolution: 1.60
    fold_type: "alpha"

  - pdb_id: 1UBQ
    chain: A
    description: "Ubiquitin (α+β)"
    length: 76
    resolution: 1.80
    fold_type: "alpha_beta"

  # β-sheet proteins
  - pdb_id: 1L2Y
    chain: A
    description: "Trp-cage (α-helix + β-turn)"
    length: 20
    resolution: NMR
    fold_type: "alpha"

  - pdb_id: 1PIN
    chain: A
    description: "Protein G B1 domain (α+β)"
    length: 56
    resolution: 2.10
    fold_type: "alpha_beta"

  - pdb_id: 1IMQ
