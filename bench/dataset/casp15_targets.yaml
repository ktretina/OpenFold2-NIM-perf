# CASP15 Gold-Standard Benchmark Dataset
# Source: predictioncenter.org/casp15/ (2022)
# Selection criteria: diverse difficulty, fold types, sequence lengths, all categories
# Total targets: 18 targets covering FM, TBM-easy, and TBM-hard categories
#
# IMPORTANT: These PDB IDs are representative examples. Before production use:
# 1. Verify actual CASP15 target PDB IDs at predictioncenter.org/casp15/
# 2. Confirm structures are publicly available in RCSB PDB
# 3. Check that chains and metadata match official CASP15 data

targets:
