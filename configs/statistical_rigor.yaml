# Statistical Rigor Benchmark
#
# This configuration emphasizes statistical rigor with:
# - Sufficient warmup to eliminate cold-start effects
# - Many measurement passes for reliable percentiles (p95, p99)
# - Target shuffling to reduce order effects
#
# Suitable for publication-quality results and SLA definition.

output_dir: ${RESULTS_DIR:-results}/statistical_rigor
run_id: null  # Auto-generated timestamp

gpu:
  device_ids: [0]
  sampling_interval_ms: 50

nim:
  enabled: true
  container_image: "nvcr.io/nim/openfold/openfold2:1.0"
  warn_on_latest_tag: true
  cache_dir: "${FAST_CACHE:-$HOME}/nim_cache"
  backend: "tensorrt"
  model_sets:
    - [3]  # Single model for faster iteration

openfold:
  enabled: true
  repo_path: "${FAST_CACHE:-$HOME}/openfold_repo"
  commit_hash: "main"
  model_presets: ["model_3_ptm"]
  precision: "bf16"
  weights_source: "alphafold_official"

suites:
  - name: casp15_statistical
    targets_file: bench/dataset/casp15_targets.yaml
    msa_depth: 128

    # Proper warmup (eliminate cold-start bias)
    warmup_passes: 10

    # Sufficient samples for tail metrics (p95, p99)
    # 20 passes = robust percentile estimation
    measurement_passes: 20

    # Reduce order effects (important for detecting GPU throttling)
    shuffle_targets_each_pass: true

# Analysis Tips:
# - Focus on median (p50) for typical performance
# - Use p95 for SLA targets (e.g., "95% of requests < 60s")
# - Check p99 for tail latency issues
# - Coefficient of variation (CV) indicates stability:
#   - CV < 5%: Very stable
#   - CV < 10%: Stable
#   - CV > 20%: High variability, investigate causes
#
# Example analysis:
#   bench analyze results/statistical_rigor/latest --show-percentiles
