# Fast benchmark configuration (~1-2 hours on single GPU)
output_dir: results
run_id: null  # Auto-generated if null

gpu:
  device_ids: [0]
  sampling_interval_ms: 50

nim:
  enabled: true
  container_image: "nvcr.io/nim/openfold/openfold2:latest"
  cache_dir: "${FAST_CACHE:-$HOME}/nim_cache"
  port: 8000
  base_url: null  # Start local container
  backend: "tensorrt"
  model_sets:
    - [3]              # Fast: single model
    - [1, 2, 3, 4, 5]  # Slow: ensemble

openfold:
  enabled: true
  repo_path: "${FAST_CACHE:-$HOME}/openfold_repo"
  commit_hash: "main"
  model_presets:
    - "model_3_ptm"
  precision: "bf16"
  use_deepspeed: false

suites:
  - name: accuracy_small
    targets_file: bench/dataset/targets.yaml
    msa_depth: 1
    repeats: 3
    warmup_runs: 1
