[project]
name = "openfold2-bench"
version = "0.1.0"
description = "Production-ready benchmarking framework comparing NVIDIA OpenFold2 NIM vs OpenFold"
authors = [
    {name = "NVIDIA Performance Team"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0.0",
    "requests>=2.31.0",
    "docker>=7.0.0",
    "psutil>=5.9.0",
    "py3nvml>=0.2.7",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "pyarrow>=14.0.0",
    "biopython>=1.83",
    "plotly>=5.18.0",
    "rich>=13.7.0",
    "httpx>=0.26.0",
    "tabulate>=0.9.0",  # Required for pandas.to_markdown()
]

[project.optional-dependencies]
# Fix #4: Make kaleido optional for HPC compatibility
plots = [
    "kaleido>=0.2.1",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.12.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

[project.scripts]
bench = "bench.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bench"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
